; bb_mcuhub firmware (§08) — ESP32 hubs for the follower slice.
;
; Toolchain copied from the reference climber project: the pioarduino fork is
; required for arduino-esp32 3.x (ESP-IDF 5.x), which is where the TWAI driver
; API used by link_esp32.cpp lives. board/framework/baud match the reference.
;
; Two envs:
;   imu_root  — the IMU board, built as the ROOT HUB (UART↔CAN bridge + sense),
;               NODE 0x02. Flash:  pio run -e imu_root -t upload
;   motor_leaf— the wheel motor, a CAN leaf with the on-chip floor, NODE 0x05.
;               Flash:  pio run -e motor_leaf -t upload
;
; Shared platform sources (codec, scheduler, router, link, main loop) compile
; into both; each env adds its hub's mcu/ sources and the generated headers.

[platformio]
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = lolin32_lite
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -Iinclude
  -I../hubs/imu/mcu
  -I../hubs/motor/mcu
  -Wall

; ---- IMU = root hub (sense + UART↔CAN bridge), NODE 0x02 ----
[env:imu_root]
build_flags =
  ${env.build_flags}
  -DROOT_HUB
  -DMY_NODE=0x02
  -DHOST_UART_BAUD=1000000
build_src_filter =
  +<src/crc16.c> +<src/cobs.c> +<src/frame.c> +<src/transport.c>
  +<src/scheduler.c> +<src/router.c>
  +<src/esp32/link_esp32.cpp> +<src/esp32/hub_main.cpp>
  +<../hubs/imu/mcu/imu_sensor.c> +<../hubs/imu/mcu/main_imu.cpp>

; ---- motor = CAN leaf (act behind the floor), NODE 0x05 ----
[env:motor_leaf]
build_flags =
  ${env.build_flags}
  -DMY_NODE=0x05
build_src_filter =
  +<src/crc16.c> +<src/cobs.c> +<src/frame.c> +<src/transport.c>
  +<src/scheduler.c> +<src/router.c> +<src/floor.c>
  +<src/esp32/link_esp32.cpp> +<src/esp32/hub_main.cpp>
  +<../hubs/motor/mcu/motor_hub.c> +<../hubs/motor/mcu/main_motor.cpp>
