; bb_mcuhub firmware (§08) — ESP32 hubs for the follower + segby_v1 slices.
;
; Toolchain copied from the reference climber project: the pioarduino fork is
; required for arduino-esp32 3.x (ESP-IDF 5.x), which is where the TWAI driver
; API used by link_esp32.cpp lives. board/framework/baud match the reference.
;
; Generated artifacts are ROBOT-SCOPED (§09): each env adds -Igen/<slug> so it
; picks up THAT robot's wire_contract.h — crucially BACKPLANE_TRANSPORT_UART
; (0 for the all-CAN follower, 1 for segby's UART backplane). There is no stale
; firmware/include/wire_contract.h to shadow it (the fixed-path copy is gone).
;
; Four envs:
;   imu_root    — follower IMU board, ROOT HUB (UART host ↔ CAN backplane +
;                 sense), NODE 0x02.  pio run -e imu_root -t upload
;   motor_leaf  — follower wheel motor, a CAN leaf with the on-chip floor,
;                 NODE 0x05.          pio run -e motor_leaf -t upload
;   blaster_root— segby_v1 Blaster, ROOT HUB (UART host ↔ UART backplane +
;                 IMU/range/LED), NODE 0x02.   pio run -e blaster_root -t upload
;   wheels_leaf — segby_v1 Wheels, a UART leaf — ONE MKS Dual FOC board driving
;                 BOTH wheels behind two on-chip floors, NODE 0x05.
;                                              pio run -e wheels_leaf -t upload
;
; Shared platform sources (codec, scheduler, router, link, main loop) compile
; into every env; each env adds its hub's hand-written device file (mcu/<hub>.cpp)
; and the generated headers. The mechanical per-hub glue is GENERATED into
; gen/<slug>/<hub>.glue.h (router table, hub_on_body, the floor/status/sense
; plumbing, the schedule, hub_setup/hub_tasks) and #include'd by the device file;
; the user writes ONLY the device hooks (prototypes in gen/<slug>/<hub>.device.h),
; per ADR-0003. -Igen/<slug> (already present) resolves both generated headers.

[platformio]
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = lolin32_lite
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -Iinclude
  -I../hubs/imu/mcu
  -I../hubs/motor/mcu
  -I../hubs/blaster/mcu
  -I../hubs/wheels/mcu
  -Wall

; ---- follower IMU = root hub (sense + UART↔CAN bridge), NODE 0x02 ----
[env:imu_root]
build_flags =
  ${env.build_flags}
  -Igen/follower
  -DROOT_HUB
  -DMY_NODE=0x02
  -DHOST_UART_BAUD=1000000
build_src_filter =
  +<src/crc16.c> +<src/cobs.c> +<src/frame.c> +<src/transport.c>
  +<src/scheduler.c> +<src/router.c> +<src/segment.c>
  +<src/esp32/link_esp32.cpp> +<src/esp32/hub_main.cpp>
  +<../hubs/imu/mcu/imu.cpp>

; ---- follower motor = CAN leaf (act behind the floor), NODE 0x05 ----
[env:motor_leaf]
build_flags =
  ${env.build_flags}
  -Igen/follower
  -DMY_NODE=0x05
build_src_filter =
  +<src/crc16.c> +<src/cobs.c> +<src/frame.c> +<src/transport.c>
  +<src/scheduler.c> +<src/router.c> +<src/floor.c> +<src/segment.c>
  +<src/esp32/link_esp32.cpp> +<src/esp32/hub_main.cpp>
  +<../hubs/motor/mcu/motor.cpp>

; ---- segby_v1 Blaster = root hub (sense pose/range + drive LED + UART
;      backplane to the wheels leaf), NODE 0x02. BACKPLANE_TRANSPORT_UART=1
;      comes from gen/segby_v1/wire_contract.h, so the link layer brings up
;      Serial2 as the backplane (no CAN/TWAI). segment.c is included for link
;      safety, though its seg_* path is compiled out under a UART backplane. ----
[env:blaster_root]
build_flags =
  ${env.build_flags}
  -Igen/segby_v1
  -DROOT_HUB
  -DMY_NODE=0x02
  -DHOST_UART_BAUD=1000000
build_src_filter =
  +<src/crc16.c> +<src/cobs.c> +<src/frame.c> +<src/transport.c>
  +<src/scheduler.c> +<src/router.c> +<src/segment.c>
  +<src/esp32/link_esp32.cpp> +<src/esp32/hub_main.cpp>
  +<../hubs/blaster/mcu/blaster.cpp>

; ---- segby_v1 Wheels = UART leaf, ONE MKS Dual FOC board driving BOTH wheels
;      behind two independent on-chip floors, NODE 0x05. SimpleFOC drives M0/M1
;      in torque-voltage mode (the move() calls are -DARDUINO-guarded). ----
[env:wheels_leaf]
lib_deps =
  askuric/Simple FOC@^2.3.4
build_flags =
  ${env.build_flags}
  -Igen/segby_v1
  -DMY_NODE=0x05
build_src_filter =
  +<src/crc16.c> +<src/cobs.c> +<src/frame.c> +<src/transport.c>
  +<src/scheduler.c> +<src/router.c> +<src/floor.c> +<src/segment.c>
  +<src/esp32/link_esp32.cpp> +<src/esp32/hub_main.cpp>
  +<../hubs/wheels/mcu/wheels.cpp>
